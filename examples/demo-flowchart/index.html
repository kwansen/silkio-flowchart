<!doctype html>
<html lang="zh-CN" class="h-full">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flowchart Demo</title>
  <!-- 样式在 head 阶段加载，避免模块脚本 defer 注入导致的 FOUC 闪烁 -->
  <link rel="stylesheet" href="/src/styles.css" />
</head>

<body class="h-full overflow-hidden bg-white text-[13px] leading-normal text-gray-800">
  <!-- 图标精灵：工具条 / 菜单 / 侧边栏共用同一套线性图标 -->
  <svg class="absolute h-0 w-0 overflow-hidden" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-flow" viewBox="0 0 24 24">
      <rect x="3" y="3" width="7" height="7" rx="1.5" />
      <rect x="14" y="14" width="7" height="7" rx="1.5" />
      <path d="M10 6.5h4a3 3 0 0 1 3 3v4.5" />
    </symbol>
    <symbol id="i-undo" viewBox="0 0 24 24">
      <polyline points="9 14 4 9 9 4" />
      <path d="M20 20v-7a4 4 0 0 0-4-4H4" />
    </symbol>
    <symbol id="i-redo" viewBox="0 0 24 24">
      <polyline points="15 14 20 9 15 4" />
      <path d="M4 20v-7a4 4 0 0 1 4-4h12" />
    </symbol>
    <symbol id="i-plus-box" viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" rx="3" />
      <line x1="12" y1="8" x2="12" y2="16" />
      <line x1="8" y1="12" x2="16" y2="12" />
    </symbol>
    <symbol id="i-swap" viewBox="0 0 24 24">
      <polyline points="16 3 20 7 16 11" />
      <line x1="20" y1="7" x2="5" y2="7" />
      <polyline points="8 13 4 17 8 21" />
      <line x1="4" y1="17" x2="19" y2="17" />
    </symbol>
    <symbol id="i-copy" viewBox="0 0 24 24">
      <rect x="8" y="8" width="12" height="12" rx="2" />
      <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" />
    </symbol>
    <symbol id="i-paste" viewBox="0 0 24 24">
      <rect x="5" y="5" width="14" height="16" rx="2" />
      <path d="M9 5V3h6v2" />
      <line x1="9" y1="12" x2="15" y2="12" />
      <line x1="9" y1="16" x2="15" y2="16" />
    </symbol>
    <symbol id="i-trash" viewBox="0 0 24 24">
      <polyline points="3 6 5 6 21 6" />
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
    </symbol>
    <symbol id="i-fit" viewBox="0 0 24 24">
      <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3" />
    </symbol>
    <symbol id="i-export" viewBox="0 0 24 24">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
      <polyline points="7 10 12 15 17 10" />
      <line x1="12" y1="3" x2="12" y2="15" />
    </symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24">
      <path d="M12 3l1.8 4.9L18.7 9.7l-4.9 1.8L12 16.4l-1.8-4.9L5.3 9.7l4.9-1.8z" />
      <path d="M18.5 15.5l0.8 2.2 2.2 0.8-2.2 0.8-0.8 2.2-0.8-2.2-2.2-0.8 2.2-0.8z" />
      <path d="M5 15l0.6 1.7L7.3 17.3l-1.7 0.6L5 19.6l-0.6-1.7-1.7-0.6 1.7-0.6z" />
    </symbol>
    <symbol id="i-settings" viewBox="0 0 24 24">
      <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
      <circle cx="12" cy="12" r="3" />
    </symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24">
      <polyline points="9 6 15 12 9 18" />
    </symbol>
    <symbol id="i-arrow-up" viewBox="0 0 24 24">
      <line x1="12" y1="19" x2="12" y2="5" />
      <polyline points="5 12 12 5 19 12" />
    </symbol>
    <symbol id="i-stop" viewBox="0 0 24 24">
      <rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor" stroke="none" />
    </symbol>

    <!-- 形状预览：添加节点 / 替换形状菜单共用 -->
    <symbol id="s-rect" viewBox="0 0 40 24"><rect x="4" y="5" width="32" height="14" rx="2" /></symbol>
    <symbol id="s-diamond" viewBox="0 0 40 24"><path d="M20 3 36 12 20 21 4 12Z" /></symbol>
    <symbol id="s-ellipse" viewBox="0 0 40 24"><ellipse cx="20" cy="12" rx="16" ry="8" /></symbol>
    <symbol id="s-parallelogram" viewBox="0 0 40 24"><path d="M10 5h28l-8 14H2z" /></symbol>
    <symbol id="s-hexagon" viewBox="0 0 40 24"><path d="M10 5h20l7 7-7 7H10l-7-7z" /></symbol>
    <symbol id="s-database" viewBox="0 0 40 24">
      <ellipse cx="20" cy="6" rx="13" ry="3.5" />
      <path d="M7 6v12c0 2 6 3.5 13 3.5s13-1.5 13-3.5V6" />
      <path d="M7 12c0 2 6 3.5 13 3.5S33 14 33 12" />
    </symbol>
    <symbol id="s-note" viewBox="0 0 40 24">
      <path d="M4 5h25l7 7v7H4z" />
      <path d="M29 5v7h7" />
    </symbol>
  </svg>

  <div class="flex h-screen w-screen overflow-hidden">
    <!-- 画布区：悬浮控件锚定于此容器，宽度随 AI 侧边栏开合自动伸缩 -->
    <main class="relative h-full min-w-0 flex-1" id="stage">
      <canvas id="canvas" class="block h-full w-full bg-white"></canvas>

      <!-- 左上角标识 -->
      <div class="absolute top-4 left-4 z-10 flex h-10 items-center gap-2 rounded-[10px] bg-white px-3 text-xs shadow-[0_2px_8px_rgba(0,0,0,0.1)] select-none">
        <svg class="h-4 w-4 shrink-0 fill-none stroke-current text-violet-500 stroke-[1.5] [stroke-linecap:round] [stroke-linejoin:round]"><use href="#i-flow" /></svg>
        <span>流程图</span>
        <span class="border-l border-gray-200 pl-2 text-[10px] text-gray-400">Silker Demo</span>
      </div>

      <!-- 胶囊工具条：撤销/重做等直接点击，形状/导出/缩放项悬浮展开 -->
      <div class="absolute top-4 right-4 z-10 flex items-center gap-0.5 rounded-[10px] bg-white p-1 shadow-[0_2px_8px_rgba(0,0,0,0.1)]" id="toolbar">
        <button class="tb-btn flex h-8 w-8 cursor-pointer items-center justify-center rounded-md text-gray-800 hover:bg-gray-100 disabled:cursor-not-allowed disabled:text-gray-300" id="undo-btn" title="撤销" aria-label="撤销">
          <svg class="h-4 w-4 shrink-0 fill-none stroke-current stroke-[1.5] [stroke-linecap:round] [stroke-linejoin:round]"><use href="#i-undo" /></svg>
        </button>
        <button class="tb-btn flex h-8 w-8 cursor-pointer items-center justify-center rounded-md text-gray-800 hover:bg-gray-100 disabled:cursor-not-allowed disabled:text-gray-300" id="redo-btn" title="重做" aria-label="重做">
          <svg class="h-4 w-4 shrink-0 fill-none stroke-current stroke-[1.5] [stroke-linecap:round] [stroke-linejoin:round]"><use href="#i-redo" /></svg>
        </button>
        <span class="mx-0.5 h-4 w-px bg-gray-200"></span>

        <div class="tb-item relative" data-menu="add">
          <button class="tb-btn flex h-8 w-8 cursor-pointer items-center justify-center rounded-md text-gray-800 hover:bg-gray-100 disabled:cursor-not-allowed disabled:text-gray-300" title="添加节点" aria-label="添加节点">
            <svg class="h-4 w-4 shrink-0 fill-none stroke-current stroke-[1.5] [stroke-linecap:round] [stroke-linejoin:round]"><use href="#i-plus-box" /></svg>
          </button>
          <div class="menu absolute top-[calc(100%+10px)] right-0 z-20 flex min-w-43 flex-col gap-0.5 rounded-[10px] bg-white p-1 shadow-[0_4px_16px_rgba(0,0,0,0.12)] before:absolute before:-top-2.5 before:right-0 before:left-0 before:h-2.5 before:content-['']" id="add-menu" hidden>
            <div class="px-2.5 pt-1 pb-0.5 text-[10px] text-gray-400 select-none">添加节点</div>
          </div>
        </div>
        <div class="tb-item relative" data-menu="replace">
          <button class="tb-btn flex h-8 w-8 cursor-pointer items-center justify-center rounded-md text-gray-800 hover:bg-gray-100 disabled:cursor-not-allowed disabled:text-gray-300" title="替换选中节点形状" aria-label="替换选中节点形状">
            <svg class="h-4 w-4 shrink-0 fill-none stroke-current stroke-[1.5] [stroke-linecap:round] [stroke-linejoin:round]"><use href="#i-swap" /></svg>
          </button>
          <div class="menu absolute top-[calc(100%+10px)] right-0 z-20 flex min-w-43 flex-col gap-0.5 rounded-[10px] bg-white p-1 shadow-[0_4px_16px_rgba(0,0,0,0.12)] before:absolute before:-top-2.5 before:right-0 before:left-0 before:h-2.5 before:content-['']" id="replace-menu" hidden>
            <div class="px-2.5 pt-1 pb-0.5 text-[10px] text-gray-400 select-none">替换选中形状</div>
          </div>
        </div>

        <button class="tb-btn flex h-8 w-8 cursor-pointer items-center justify-center rounded-md text-gray-800 hover:bg-gray-100 disabled:cursor-not-allowed disabled:text-gray-300" id="copy-btn" title="复制选中" aria-label="复制选中">
          <svg class="h-4 w-4 shrink-0 fill-none stroke-current stroke-[1.5] [stroke-linecap:round] [stroke-linejoin:round]"><use href="#i-copy" /></svg>
        </button>
        <button class="tb-btn flex h-8 w-8 cursor-pointer items-center justify-center rounded-md text-gray-800 hover:bg-gray-100 disabled:cursor-not-allowed disabled:text-gray-300" id="paste-btn" title="粘贴" aria-label="粘贴">
          <svg class="h-4 w-4 shrink-0 fill-none stroke-current stroke-[1.5] [stroke-linecap:round] [stroke-linejoin:round]"><use href="#i-paste" /></svg>
        </button>
        <button class="tb-btn flex h-8 w-8 cursor-pointer items-center justify-center rounded-md text-gray-800 hover:bg-gray-100 disabled:cursor-not-allowed disabled:text-gray-300" id="delete-btn" title="删除选中" aria-label="删除选中">
          <svg class="h-4 w-4 shrink-0 fill-none stroke-current stroke-[1.5] [stroke-linecap:round] [stroke-linejoin:round]"><use href="#i-trash" /></svg>
        </button>
        <button class="tb-btn flex h-8 w-8 cursor-pointer items-center justify-center rounded-md text-gray-800 hover:bg-gray-100 disabled:cursor-not-allowed disabled:text-gray-300" id="fit-btn" title="适应视图" aria-label="适应视图">
          <svg class="h-4 w-4 shrink-0 fill-none stroke-current stroke-[1.5] [stroke-linecap:round] [stroke-linejoin:round]"><use href="#i-fit" /></svg>
        </button>
        <span class="mx-0.5 h-4 w-px bg-gray-200"></span>

        <div class="tb-item relative" data-menu="export">
          <button class="tb-btn flex h-8 w-8 cursor-pointer items-center justify-center rounded-md text-gray-800 hover:bg-gray-100 disabled:cursor-not-allowed disabled:text-gray-300" title="导出" aria-label="导出">
            <svg class="h-4 w-4 shrink-0 fill-none stroke-current stroke-[1.5] [stroke-linecap:round] [stroke-linejoin:round]"><use href="#i-export" /></svg>
          </button>
          <div class="menu absolute top-[calc(100%+10px)] right-0 z-20 flex flex-col gap-0.5 rounded-[10px] bg-white p-1 shadow-[0_4px_16px_rgba(0,0,0,0.12)] before:absolute before:-top-2.5 before:right-0 before:left-0 before:h-2.5 before:content-['']" id="export-menu" hidden>
            <button class="menu-item flex w-full cursor-pointer items-center gap-2 rounded-md px-2.5 py-1.5 text-left text-xs whitespace-nowrap text-gray-700 hover:bg-gray-100" id="copy-json-btn">复制 JSON</button>
            <button class="menu-item flex w-full cursor-pointer items-center gap-2 rounded-md px-2.5 py-1.5 text-left text-xs whitespace-nowrap text-gray-700 hover:bg-gray-100" id="export-json-btn">导出 JSON</button>
            <button class="menu-item flex w-full cursor-pointer items-center gap-2 rounded-md px-2.5 py-1.5 text-left text-xs whitespace-nowrap text-gray-700 hover:bg-gray-100" id="export-img-btn">导出图片</button>
            <button class="menu-item flex w-full cursor-pointer items-center gap-2 rounded-md px-2.5 py-1.5 text-left text-xs whitespace-nowrap text-gray-700 hover:bg-gray-100" id="export-hd-btn">导出图片（2倍高清）</button>
          </div>
        </div>
        <div class="tb-item relative" data-menu="zoom">
          <button class="tb-btn flex h-8 w-8 cursor-pointer items-center justify-center rounded-md text-[11px] tabular-nums text-gray-800 hover:bg-gray-100 disabled:cursor-not-allowed disabled:text-gray-300" id="zoom-trigger" title="缩放">
            <span id="zoom-label">100</span>
          </button>
          <div class="menu absolute top-[calc(100%+10px)] right-0 z-20 flex min-w-45 flex-col items-center gap-0.5 rounded-[10px] bg-white px-3.5 py-2.5 shadow-[0_4px_16px_rgba(0,0,0,0.12)] before:absolute before:-top-2.5 before:right-0 before:left-0 before:h-2.5 before:content-['']" hidden>
            <input id="zoom-range" type="range" min="20" max="800" step="5" value="100" aria-label="缩放比例" class="h-1 w-35 cursor-pointer appearance-none rounded-full outline-none [&::-webkit-slider-thumb]:h-3.5 [&::-webkit-slider-thumb]:w-3.5 [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:bg-violet-500 [&::-webkit-slider-thumb]:shadow-[0_1px_3px_rgba(0,0,0,0.35)] [&::-moz-range-thumb]:h-3.5 [&::-moz-range-thumb]:w-3.5 [&::-moz-range-thumb]:rounded-full [&::-moz-range-thumb]:border-0 [&::-moz-range-thumb]:bg-violet-500" />
          </div>
        </div>

        <!-- AI 侧边栏开关 -->
        <button class="tb-btn flex h-8 w-8 cursor-pointer items-center justify-center rounded-md text-violet-500 hover:bg-gray-100 disabled:cursor-not-allowed disabled:text-gray-300" id="ai-toggle" title="AI 助手" aria-label="AI 助手">
          <svg class="h-4 w-4 shrink-0 fill-none stroke-current stroke-[1.5] [stroke-linecap:round] [stroke-linejoin:round]"><use href="#i-sparkles" /></svg>
        </button>
      </div>

      <div class="absolute bottom-4 left-4 z-10 max-w-[min(680px,calc(100%-32px))] rounded-[10px] border border-gray-200 bg-[rgba(255,255,255,0.92)] px-3 py-2 text-[11px] leading-[1.7] text-gray-500 backdrop-blur-[6px] select-none">
        点击选中 · 拖拽移动 · 双击编辑文字 · 选中后拖动蓝色圆点连线 · Ctrl+C 复制 · Ctrl+V 粘贴 · Ctrl+Z 撤销 · Ctrl+Y 重做 · Delete 删除 · 滚轮缩放 · 右键拖拽平移
      </div>
    </main>

    <!-- AI 助手侧边栏：并列布局面板，保留对话历史 / 流式思考 / 执行反馈 -->
    <aside class="flex h-full w-90 shrink-0 flex-col border-l border-gray-100 bg-white" id="ai-sidebar">
      <div class="flex items-center gap-2 border-b border-gray-100 px-4 py-3">
        <svg class="h-4 w-4 shrink-0 fill-none stroke-current text-violet-500 stroke-[1.5] [stroke-linecap:round] [stroke-linejoin:round]"><use href="#i-sparkles" /></svg>
        <span class="flex-1 text-[13px] font-medium">AI 助手</span>
        <button class="cursor-pointer text-xs text-gray-400 hover:text-gray-600 disabled:cursor-not-allowed disabled:opacity-50" id="ai-clear" disabled>清空</button>
        <button class="flex h-7 w-7 cursor-pointer items-center justify-center rounded-lg text-gray-400 hover:bg-gray-100 hover:text-gray-600" id="ai-settings-toggle" title="AI 服务配置" aria-label="AI 服务配置">
          <svg class="h-4 w-4 shrink-0 fill-none stroke-current stroke-[1.5] [stroke-linecap:round] [stroke-linejoin:round]"><use href="#i-settings" /></svg>
        </button>
        <button class="flex h-7 w-7 cursor-pointer items-center justify-center rounded-lg text-gray-400 hover:bg-gray-100 hover:text-gray-600" id="ai-collapse" title="收起" aria-label="收起">
          <svg class="h-4 w-4 shrink-0 fill-none stroke-current stroke-[1.5] [stroke-linecap:round] [stroke-linejoin:round]"><use href="#i-chevron-right" /></svg>
        </button>
      </div>

      <!-- 服务配置（OpenAI 兼容接口，localStorage 持久化） -->
      <div class="flex flex-col gap-2 border-b border-gray-100 bg-gray-50 p-3" id="ai-settings" hidden>
        <input id="ai-base-url" placeholder="接口地址（含 /v1），如 https://api.deepseek.com/v1" class="h-8 w-full rounded-lg border border-gray-200 bg-white px-2.5 text-xs text-gray-800 outline-none focus:border-violet-400" />
        <input id="ai-api-key" type="password" placeholder="API Key" class="h-8 w-full rounded-lg border border-gray-200 bg-white px-2.5 text-xs text-gray-800 outline-none focus:border-violet-400" />
        <input id="ai-model" placeholder="模型名，如 deepseek-chat" class="h-8 w-full rounded-lg border border-gray-200 bg-white px-2.5 text-xs text-gray-800 outline-none focus:border-violet-400" />
        <div class="flex items-center justify-between gap-2">
          <span class="text-[10px] text-gray-400">保存在浏览器本地；服务端需允许跨域或走本地代理</span>
          <button class="h-7 shrink-0 cursor-pointer rounded-lg bg-gray-900 px-3 text-xs whitespace-nowrap text-white hover:bg-gray-700" id="ai-save">保存</button>
        </div>
      </div>

      <!-- 消息流 -->
      <div class="flex min-h-0 flex-1 flex-col gap-3 overflow-y-auto p-3 [&::-webkit-scrollbar]:w-1.5 [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-thumb]:bg-gray-200" id="chat-box">
        <div class="mt-10 text-center text-xs leading-[1.9] text-gray-400" id="ai-empty">
          输入指令生成或修改流程，如：<br />画一个用户注册审批流程，包含验证码校验和失败重试<br />把「校验通过？」改成「是否为管理员」<br />在末尾加一个「发送通知」节点<br />这个流程图讲了什么 / 撤销上一步
        </div>
      </div>

      <!-- 输入区 -->
      <div class="flex items-center gap-2 border-t border-gray-100 p-2.5">
        <input id="ai-prompt" placeholder="输入指令或提问…" autocomplete="off" class="h-9 min-w-0 flex-1 rounded-lg bg-gray-50 px-3 text-sm text-gray-800 outline-none placeholder:text-gray-400 focus:shadow-[inset_0_0_0_1px_#ddd6fe]" />
        <button class="flex h-9 w-9 shrink-0 cursor-pointer items-center justify-center rounded-lg bg-violet-500 text-white hover:bg-violet-600 disabled:cursor-not-allowed disabled:opacity-50" id="ai-send" disabled title="发送" aria-label="发送">
          <svg class="h-4 w-4 shrink-0 fill-none stroke-current stroke-2 [stroke-linecap:round] [stroke-linejoin:round]" id="send-icon"><use href="#i-arrow-up" /></svg>
          <svg class="h-4 w-4 shrink-0 fill-none stroke-current stroke-2 [stroke-linecap:round] [stroke-linejoin:round]" id="stop-icon" hidden><use href="#i-stop" /></svg>
        </button>
      </div>
    </aside>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
